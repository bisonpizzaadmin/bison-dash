<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bison Dashboard</title>
<style>
  :root { --bg:#f6f4f0; --ink:#1d1b18; --mut:#6b665e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161412; --ink:#f1ede6; --mut:#a49d92; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--mut);
         font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; text-align:center; }
  #msg.bad { color:#c62828; }
</style>
</head>
<body>
<div id="msg">🍕 Loading Bison Dashboard…</div>
<script>
/* Bison Dashboard host page (Oct 19, 2026). Loads the Apps Script dashboard through DashApi.gs (doPost) without Google cookies,
   so it works whatever Google account the phone uses. Login = the dashboard's own Bison Portal login (Portal.gs). */
const API = 'https://script.google.com/macros/s/AKfycbzjO4KPFIGeaoPxCzNmIa8eRTbg7w_pgRmw6c6ILhVeTBsb31tGDl3J6oo2eZICsbFSBw/exec';   // Web app URL from Apps Script: ends in /exec, nothing after it

function say(t, bad) { const m = document.getElementById('msg'); if (!m) return; m.textContent = t; m.className = bad ? 'bad' : ''; }

/* Runs inside the dashboard page: replaces google.script.run with fetch calls to DashApi.gs. */
function bisonShim(API) {
  function call(f, args) {
    return fetch(API, { method: 'POST', body: JSON.stringify({ a: 'call', f: f, args: args }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' })
      .then(function (r) { return r.text(); }, function () { throw new Error('No connection to the server.'); })
      .then(function (txt) {
        let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('Server did not answer'); }
        if (!j.ok) throw new Error(j.err || 'error');
        return j.r;
      });
  }
  function runner(ok, fail, uo) {
    return new Proxy({}, { get: function (_, name) {
      if (typeof name !== 'string' || name === 'then') return undefined;
      if (name === 'withSuccessHandler') return function (fn) { return runner(fn, fail, uo); };
      if (name === 'withFailureHandler') return function (fn) { return runner(ok, fn, uo); };
      if (name === 'withUserObject') return function (o) { return runner(ok, fail, o); };
      return function () {
        const args = Array.prototype.slice.call(arguments);
        call(name, args).then(function (r) { if (ok) ok(r, uo); }, function (e) { if (fail) fail(e, uo); else console.error(e); });
      };
    } });
  }
  window.google = window.google || {};
  window.google.script = {
    run: runner(null, null, undefined),
    host: { close: function () {}, setHeight: function () {}, setWidth: function () {}, editor: { focus: function () {} } },
    url: { getLocation: function (cb) { cb({ hash: '', parameter: {}, parameters: {} }); } },
    history: { push: function () {}, replace: function () {}, setChangeHandler: function () {} }
  };
}

async function start() {
  if (API.indexOf('/exec') < 0) { say('Setup: paste the web app URL into API at the top of index.html.', true); return; }
  let j;
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({ a: 'page' }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' });
    j = JSON.parse(await r.text());
  } catch (e) { say('Server did not answer. Check the web app URL and that a New version is deployed.', true); return; }
  if (!j.ok) { say(j.err || 'Could not load the dashboard.', true); return; }
  const shim = '<meta name="viewport" content="width=device-width, initial-scale=1"><script>(' + bisonShim.toString() + ')(' +
    JSON.stringify(API) + ');<\/script>';
  let html = String(j.html);
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + shim; }) : shim + html;
  document.open(); document.write(html); document.close();
}
start();
</script>
</body>
</html>
