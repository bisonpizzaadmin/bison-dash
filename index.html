<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://bison-dash.bisonpizzaadmin.workers.dev" crossorigin>
<title>Bison Dashboard</title>
<style>
  :root { --bg:#f6f4f0; --ink:#1d1b18; --mut:#6b665e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161412; --ink:#f1ede6; --mut:#a49d92; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--mut);
         font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; text-align:center; }
  #msg.bad { color:#c62828; }
</style>
</head>
<body>
<div id="msg">🍕 Loading Bison Dashboard…</div>
<script>
/* Bison Dashboard host page (Oct 19, 2026; fast version Oct 19 late; Oct 20: today's business date worked out on the phone,
   speed meter = add #speed to the address; Cash also kept on the phone; all tabs pre-loaded after login).
   Talks to the Cloudflare Worker first (fast, keeps ready-made views), and straight to Apps Script (DashApi.gs) only if the
   Worker can't be reached. Login = the dashboard's own Bison Portal login (Portal.gs).
   Speed on the phone: the page itself and the last numbers of Overview / P&L / Inventory / Channel split / Expenses are kept
   on this device, shown at once, then refreshed quietly. Logging out clears them. */
const API = 'https://bison-dash.bisonpizzaadmin.workers.dev';   // Cloudflare Worker address
const GAS = 'https://script.google.com/macros/s/AKfycbzjO4KPFIGeaoPxCzNmIa8eRTbg7w_pgRmw6c6ILhVeTBsb31tGDl3J6oo2eZICsbFSBw/exec';   // Apps Script web app (fallback)
const PAGE_KEY = 'bisonPage';

function say(t, bad) { const m = document.getElementById('msg'); if (!m) return; m.textContent = t; m.className = bad ? 'bad' : ''; }

/* Runs inside the dashboard page: replaces google.script.run with fetch calls (Worker first, Apps Script if it can't be reached). */
function bisonShim(CFG) {
  var URLS = CFG.api ? [CFG.api, CFG.gas] : [CFG.gas];
  var SWR = { dashData: 1, finChan: 1, plnData: 1, invdData: 1, expData: 1, payData: 1, smxData: 1, cdData: 1, cdEntries: 1 };   // shown from the phone first, then refreshed
  var IDX = 'bswrIdx', MAX = 40;
  /* ---- speed meter (Oct 20): open the dashboard with #speed at the end of the address to see every call's time ---- */
  var SPEED = /speed/.test(location.hash + location.search), LOG = [];
  function meter(f, ms, src) {
    if (!SPEED) return;
    LOG.unshift({ f: f, ms: ms, src: src, t: new Date().toLocaleTimeString() }); LOG = LOG.slice(0, 14);
    var el = document.getElementById('bzSpeed');
    if (!el) { el = document.createElement('div'); el.id = 'bzSpeed';
      el.style.cssText = 'position:fixed;top:8px;right:8px;z-index:99;background:rgba(20,10,6,.9);color:#FBF3E9;font:12px/1.5 monospace;padding:8px 10px;border-radius:12px;max-width:92vw;pointer-events:none';
      document.body.appendChild(el); }
    el.innerHTML = '<b>⚡ speed</b><br>' + LOG.map(function (x) {
      var c = x.ms < 700 ? '#5BBE7C' : x.ms < 2500 ? '#FFB259' : '#F2765F';
      return '<span style="color:' + c + '">' + String(x.ms).padStart(5, ' ') + ' ms</span> ' + x.f + ' <i>' + x.src + '</i>'; }).join('<br>');
  }
  function post(i, body, f) {
    var t0 = Date.now(), src = i === 0 && CFG.api ? 'worker' : 'apps script';
    return fetch(URLS[i], { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' })
      .then(function (r) { var h = r.headers.get('X-Cache'); var p = r.text(); p.then(function () { meter(f || 'page', Date.now() - t0, src + (h ? ' ' + h : '')); }); return p; })
      .then(function (txt) { var j; try { j = JSON.parse(txt); } catch (e) { throw { net: true }; } return j; },
            function () { throw { net: true }; })
      .catch(function (e) { if (e && e.net && i + 1 < URLS.length) return post(i + 1, body, f); if (e && e.net) throw new Error('No connection to the server.'); throw e; });
  }
  function call(f, args) {
    return post(0, JSON.stringify({ a: 'call', f: f, args: args }), f).then(function (j) { if (!j.ok) throw new Error(j.err || 'error'); return j.r; });
  }
  /* ---- last numbers kept on this phone ---- */
  function ck(f, args) { var a = args.slice(1); while (a.length && typeof a[a.length - 1] === 'boolean') a.pop(); return 'bswr:' + f + ':' + JSON.stringify(a); }
  function idx() { try { return JSON.parse(localStorage.getItem(IDX) || '[]'); } catch (e) { return []; } }
  function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsPut(k, r) {
    var val; try { val = JSON.stringify({ r: r, t: Date.now() }); } catch (e) { return; }
    for (var tries = 0; tries < 3; tries++) {
      try {
        localStorage.setItem(k, val);
        var L = idx().filter(function (x) { return x !== k; }); L.push(k);
        while (L.length > MAX) { try { localStorage.removeItem(L.shift()); } catch (e) { } }
        localStorage.setItem(IDX, JSON.stringify(L)); return;
      } catch (e) {   // phone storage full: drop the oldest half and try again
        var L2 = idx(); L2.slice(0, Math.ceil(L2.length / 2)).forEach(function (x) { try { localStorage.removeItem(x); } catch (e2) { } });
        try { localStorage.setItem(IDX, JSON.stringify(L2.slice(Math.ceil(L2.length / 2)))); } catch (e3) { }
      }
    }
  }
  function lsClear() { idx().forEach(function (x) { try { localStorage.removeItem(x); } catch (e) { } }); try { localStorage.removeItem(IDX); } catch (e) { } }
  function runner(ok, fail, uo) {
    return new Proxy({}, { get: function (_, name) {
      if (typeof name !== 'string' || name === 'then') return undefined;
      if (name === 'withSuccessHandler') return function (fn) { return runner(fn, fail, uo); };
      if (name === 'withFailureHandler') return function (fn) { return runner(ok, fn, uo); };
      if (name === 'withUserObject') return function (o) { return runner(ok, fail, o); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        if (name === 'psLogout' || name === 'psLogin') lsClear();
        var force = args.length > 0 && args[args.length - 1] === true;
        if (SWR[name]) {
          var k = ck(name, args), c = force ? null : lsGet(k);
          if (c) { meter(name, 0, 'phone'); try { if (ok) ok(c.r, uo); } catch (e) { console.error(e); } }
          call(name, args).then(function (r) { lsPut(k, r); if (!c || c.r !== r) { if (ok) ok(r, uo); } },
            function (e) { if (!c) { if (fail) fail(e, uo); else console.error(e); } });
          return;
        }
        call(name, args).then(function (r) { if (ok) ok(r, uo); }, function (e) { if (fail) fail(e, uo); else console.error(e); });
      };
    } });
  }
  window.google = window.google || {};
  window.google.script = {
    run: runner(null, null, undefined),
    host: { close: function () {}, setHeight: function () {}, setWidth: function () {}, editor: { focus: function () {} } },
    url: { getLocation: function (cb) { cb({ hash: '', parameter: {}, parameters: {} }); } },
    history: { push: function () {}, replace: function () {}, setChangeHandler: function () {} }
  };
  /* keep the page itself on the phone: after it opens, fetch the newest page quietly for next time */
  setTimeout(function () {
    post(0, JSON.stringify({ a: 'page' })).then(function (j) { if (j && j.ok && j.html) { try { localStorage.setItem(CFG.pageKey, j.html); } catch (e) { } } }, function () {});
  }, 4000);
}

/* Oct 20: the last finished business day (4 AM–4 AM, Winnipeg) worked out on the phone, so a kept page never asks for old dates. */
function lastBizDay() {
  try {
    const p = {}; new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Winnipeg', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' })
      .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
    const d = new Date(Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day)));
    d.setUTCDate(d.getUTCDate() - (Number(p.hour) < 4 ? 2 : 1));
    return d.toISOString().slice(0, 10);
  } catch (e) { return ''; }
}

function show(html) {
  const cfg = { api: API.indexOf('YOUR-SUBDOMAIN') < 0 ? API : '', gas: GAS, pageKey: PAGE_KEY };
  const last = lastBizDay();
  if (last) html = html.replace(/LAST="\d{4}-\d{2}-\d{2}"/, 'LAST="' + last + '"');
  const shim = '<meta name="viewport" content="width=device-width, initial-scale=1"><script>(' + bisonShim.toString() + ')(' +
    JSON.stringify(cfg) + ');<\/script>';
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + shim; }) : shim + html;
  document.open(); document.write(html); document.close();
}

async function start() {
  let kept = null;
  try { kept = localStorage.getItem(PAGE_KEY); } catch (e) { }
  if (kept) {   // instant; the newest page is fetched in the background for next time.
    // Oct 19 fix: wait until this starter page has finished loading - writing the dashboard while it is still loading puts it
    // INSIDE the starter page (its centring styles squeeze the dashboard to one side).
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(function () { show(kept); }, 0); });
    else setTimeout(function () { show(kept); }, 0);
    return;
  }
  const urls = API.indexOf('YOUR-SUBDOMAIN') < 0 ? [API, GAS] : [GAS];
  for (let i = 0; i < urls.length; i++) {
    try {
      const r = await fetch(urls[i], { method: 'POST', body: JSON.stringify({ a: 'page' }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' });
      const j = JSON.parse(await r.text());
      if (!j.ok) { say(j.err || 'Could not load the dashboard.', true); return; }
      try { localStorage.setItem(PAGE_KEY, String(j.html)); } catch (e) { }
      show(String(j.html));
      return;
    } catch (e) { }
  }
  say('Server did not answer. Check the Worker / web app address and that a New version is deployed.', true);
}
start();
</script>
</body>
</html>
